# Prometheus del rol "mon". Todos los destinos van por nombre de rol (D19).
# En casa, db1 y app son la misma máquina: sus gráficas se verán iguales, es normal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { rol: mon }

  # Sistema operativo de cada máquina (rol "base", puerto 9100)
  - job_name: node
    static_configs:
      - targets: ["db1:9100"]
        labels: { rol: db1 }
      - targets: ["db2:9100"]
        labels: { rol: db2 }
      - targets: ["db3:9100"]
        labels: { rol: db3 }
      - targets: ["app:9100"]
        labels: { rol: app }

  # --- Se activan en las siguientes etapas ---
  # - job_name: mysql        # mysqld_exporter :9104 en db1 y db2
  # - job_name: postgres     # postgres_exporter :9187 en db2 y db3
  # - job_name: mongodb      # mongodb_exporter :9216 en db1, db2 y db3
  # - job_name: api          # /metrics de la API en app:8080
