# Prometheus del rol "mon". Todos los destinos van por nombre de rol (D19).
# En casa, db1 y app son la misma máquina: sus gráficas se verán iguales, es normal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { rol: mon }

  # Sistema operativo de cada máquina (rol "base", puerto 9100)
  - job_name: node
    static_configs:
      - targets: ["db1:9100"]
        labels: { rol: db1 }
      - targets: ["db2:9100"]
        labels: { rol: db2 }
      - targets: ["db3:9100"]
        labels: { rol: db3 }
      - targets: ["app:9100"]
        labels: { rol: app }

  # Motores (etapa 2)
  - job_name: mysql
    static_configs:
      - targets: ["db1:9104"]
        labels: { rol: db1 }
      - targets: ["db2:9104"]
        labels: { rol: db2 }

  - job_name: postgres
    static_configs:
      - targets: ["db2:9187"]
        labels: { rol: db2 }
      - targets: ["db3:9187"]
        labels: { rol: db3 }

  - job_name: mongodb
    static_configs:
      - targets: ["db1:9216"]
        labels: { rol: db1 }
      - targets: ["db2:9216"]
        labels: { rol: db2 }
      - targets: ["db3:9216"]
        labels: { rol: db3 }

  # --- Etapa 3 ---
  # - job_name: api          # /metrics de la API en app:8080
