# Prometheus del rol "mon". Todos los destinos van por nombre de rol (D19).
# En casa, db1 y app son la misma máquina: sus gráficas se verán iguales, es normal.
# Cada 5 s (antes 15 s): en las pruebas de falla una caída de ~10 s se ve en Grafana casi al instante.
# Con este laboratorio (15 destinos, 7 días de retención) el costo en disco y CPU es mínimo.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { rol: mon }

  # Sistema operativo de cada máquina (rol "base", puerto 9100)
  - job_name: node
    static_configs:
      - targets: ["db1:9100"]
        labels: { rol: db1 }
      - targets: ["db2:9100"]
        labels: { rol: db2 }
      - targets: ["db3:9100"]
        labels: { rol: db3 }
      - targets: ["app:9100"]
        labels: { rol: app }

  # Motores (etapa 2)
  - job_name: mysql
    static_configs:
      - targets: ["db1:9104"]
        labels: { rol: db1 }
      - targets: ["db2:9104"]
        labels: { rol: db2 }

  - job_name: postgres
    static_configs:
      - targets: ["db2:9187"]
        labels: { rol: db2 }
      - targets: ["db3:9187"]
        labels: { rol: db3 }

  - job_name: mongodb
    static_configs:
      - targets: ["db1:9216"]
        labels: { rol: db1 }
      - targets: ["db2:9216"]
        labels: { rol: db2 }
      - targets: ["db3:9216"]
        labels: { rol: db3 }

  # Los dos mongos (enrutadores): un exporter aparte en el puerto 9217 junto a cada uno
  - job_name: mongos
    static_configs:
      - targets: ["app:9217"]
        labels: { rol: app }
      - targets: ["db3:9217"]
        labels: { rol: db3 }

  # API (etapa 3): compras, latencia, compensaciones y fallas por paso de la Saga
  - job_name: api
    static_configs:
      - targets: ["app:8080"]
        labels: { rol: app }

  # Vigilante de failover (etapa 4): quién es primario, nodos alcanzables, failovers
  - job_name: vigilante
    static_configs:
      - targets: ["app:8090"]
        labels: { rol: app }
