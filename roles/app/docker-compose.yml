# Rol app (D17): API + segundo mongos + vigilante de failover + simulador (bajo demanda).
# Casa: VM del escritorio. Uni: laptop de Luis.
name: ingdatos-app

services:
  mongos:
    image: mongo:7.0.14
    container_name: mongos-app
    restart: unless-stopped
    network_mode: host
    entrypoint: ["bash", "-c", "install -m 400 -o 999 -g 999 /run/mongo-keyfile /tmp/mongo-keyfile && exec docker-entrypoint.sh \"$$@\"", "mongo"]
    command: ["mongos", "--configdb", "cfgRS/db1:27019,db2:27019,db3:27019", "--port", "27017",
              "--bind_ip_all", "--keyFile", "/tmp/mongo-keyfile"]
    volumes:
      - ../../secretos/mongo-keyfile:/run/mongo-keyfile:ro

  # API (etapa 3). Se construye a partir de ../../api (la primera vez necesita internet: npm ci).
  # Solo recibe las contraseñas de los usuarios app_*: nunca root/postgres/admin.
  api:
    build: ../../api
    image: ingdatos-api:0.1.0
    container_name: api-app
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: "8080"
      MYSQL_HOSTS: db1,db2           # se usa el que no esté en read_only
      PG_HOSTS: db2,db3              # se usa el que no esté en recuperación
      MONGO_HOSTS: db3:27017,app:27017
      MYSQL_APP_PASSWORD: "${MYSQL_APP_PASSWORD:?Falta .env: corre bash scripts/generar-secretos.sh}"
      PG_APP_PASSWORD: "${PG_APP_PASSWORD:?Falta .env}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Falta .env}"

  # Vigilante de failover automático de MySQL y PostgreSQL (D25, D27). Misma imagen que la API.
  # Debe haber UNO solo en todo el laboratorio. Estado: http://app:8090/estado
  vigilante:
    build: ../../api
    image: ingdatos-api:0.1.0
    container_name: vigilante-app
    restart: unless-stopped
    network_mode: host
    command: ["node", "src/vigilante.js"]
    environment:
      PORT: "8090"
      MYSQL_HOSTS: db1,db2           # en este orden se prefiere el primario
      PG_HOSTS: db2,db3
      CICLO_MS: "2000"               # revisa cada 2 s
      UMBRAL: "5"                    # 5 ciclos sin primario (~10 s) antes de promover
      MYSQL_FAILOVER_PASSWORD: "${MYSQL_FAILOVER_PASSWORD:?Falta .env: corre bash scripts/generar-secretos.sh}"
      MYSQL_REPL_PASSWORD: "${MYSQL_REPL_PASSWORD:?Falta .env}"
      PG_FAILOVER_PASSWORD: "${PG_FAILOVER_PASSWORD:?Falta .env}"
    volumes:
      - vigilante-estado:/estado     # recuerda el último primario de cada motor

  # Simulador de transacciones (etapa 4, D26). Compra por HTTP a la API y al final da un reporte.
  # Perfil "simulador": NO arranca con "up -d". Se corre bajo demanda:
  #   bash scripts/simular.sh --n 1000          (o --tps 20 --minutos 5; --ayuda para ver todo)
  # Sin dependencias ni build: el script se monta en una imagen de Node con versión fija.
  simulador:
    image: node:22.12.0-bookworm-slim
    container_name: simulador-app
    profiles: ["simulador"]
    network_mode: host
    init: true                       # Ctrl+C llega al simulador y este imprime el reporte
    user: node
    entrypoint: ["node", "/sim/simulador.js"]
    environment:
      API: http://app:8080
      VIGILANTE: http://app:8090
    volumes:
      - ../../simulador:/sim:ro

volumes:
  vigilante-estado:
